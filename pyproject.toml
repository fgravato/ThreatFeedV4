[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "threatfeed"
version = "2.0.0"
description = "Manage Lookout threat feeds via the Lookout REST API"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Frank Gravato", email = "frank.gravato@lookout.com" }]
dependencies = [
    "requests>=2.31",
    "urllib3>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "responses>=0.25",
]

[project.scripts]
threatfeed = "threatfeed.cli:main"

[tool.setuptools.packages.find]
include = ["threatfeed*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
